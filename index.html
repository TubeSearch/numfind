<h1>number finder</h1>
<input type="text" id="num">
<button onclick="go()">find</button>
<p id="result"></p>
<p id="time"></p>
<p id="nums"></p>
<button onclick="toggle()">expand</button>
<p id="steps" hidden></p>

<script>
var memo = {};

function best(n) {
  if (n == 1n) return 0;
  var key = n.toString();
  if (memo[key] !== undefined) return memo[key];

  var r;
  if (n % 2n === 0n) {
    r = 1 + best(n / 2n);
  } else {
    r = 2 + Math.min(best((n - 1n) / 2n), best((n + 1n) / 2n));
  }
  memo[key] = r;
  return r;
}

function go() {
  var start = performance.now();
  var n = BigInt(document.getElementById("num").value);
  if (n < 0n) return;

  if (n == 0n) {
    document.getElementById("result").innerText = "fewest steps: 1";
    document.getElementById("time").innerText = "time to find: " + (performance.now() - start).toFixed(3) + " ms";
    document.getElementById("nums").innerText = "1, 0";
    document.getElementById("steps").innerText = "-1";
    return;
  }

  var steps = [];
  var nums = [n];
  var v = n;

  while (v > 1n) {
    if (v % 2n === 0n) {
      steps.push("x2");
      v = v / 2n;
      nums.push(v);
    } else {
      var a = (v - 1n) / 2n;
      var b = (v + 1n) / 2n;
      if (best(a) <= best(b)) {
        steps.push("+1");
        nums.push(v - 1n);
        v = a;
      } else {
        steps.push("-1");
        nums.push(v + 1n);
        v = b;
      }
      steps.push("x2");
      nums.push(v);
    }
  }

  steps.reverse();
  nums.reverse();

  document.getElementById("result").innerText = "fewest steps: " + steps.length;
  document.getElementById("time").innerText = "time: " + (performance.now() - start).toFixed(3) + " ms";
  document.getElementById("nums").innerText = nums.join(", ");
  document.getElementById("steps").innerText = steps.join(", ");
}

function toggle() {
  var s = document.getElementById("steps");
  s.hidden = !s.hidden;
}
</script>
